<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#241710" />
    <meta
      name="description"
      content="JAWA Coffee Shop — Good Coffee, Good Mood, Good Day. Explore our menu and find us online."
    />
    <title>JAWA Coffee | All our links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero" aria-label="JAWA Coffee Shop">
        <img
          src="images/hero-jawa.webp"
          alt="JAWA coffee shop atmosphere with a latte and cookies"
        />
      </header>
      <section class="content" aria-label="JAWA links">
        <p class="slogan">
          Good Coffee <span>•</span> Good Mood <span>•</span> Good Day
        </p>
        <div class="divider" aria-hidden="true">
          <span></span><span class="bean">◒</span><span></span>
        </div>
        <nav class="links" aria-label="Our pages">
          <a class="link" href="menu/" aria-label="Explore our menu"
            ><span class="symbol">▤</span><span class="name">Our Menu</span
            ><span class="arrow">›</span></a
          >

          <!-- Orange Cash Payment -->
          <details class="payment">
            <summary>Pay with E-Wallet</summary>

            <div class="wallet-content">
              <h3>Orange Cash</h3>

              <p id="wallet-number">01208202081</p>

              <button type="button" onclick="copyWallet()">Copy Number</button>

              <p id="payment-message"></p>

              <small>
                Please transfer your bill amount and show your payment
                confirmation to our staff.
              </small>
            </div>
          </details>

          <!-- Les autres liens continuent ici -->
          <a
            class="link"
            href="https://www.instagram.com/jawa.coffeeshop/"
            target="_blank"
            rel="noopener noreferrer"
            ><span class="symbol">◎</span><span class="name">Instagram</span
            ><span class="arrow">›</span></a
          >
          <!-- Remplacer # par l'URL exacte de votre page Facebook -->
          <a
            class="link pending"
            href="https://www.facebook.com/profile.php?id=61596835888724"
            data-pending="Facebook"
            ><span class="symbol social">f</span
            ><span class="name">Facebook</span><span class="arrow">›</span></a
          >
          <!-- Remplacer # par l'URL exacte de votre compte TikTok -->
          <a
            class="link pending"
            href="https://www.tiktok.com/@jawa.coffeeshop"
            data-pending="TikTok"
            ><span class="symbol">♪</span><span class="name">TikTok</span
            ><span class="arrow">›</span></a
          >
          <!-- Remplacer # par le lien de localisation Google Maps de JAWA -->
          <a
            class="link pending"
            href="https://maps.app.goo.gl/VF5VwrY6GmMSYRZM9?g_st=ic"
            data-pending="Google Maps"
            ><span class="symbol">⌖</span
            ><span class="name">Find Us on Google Maps</span
            ><span class="arrow">›</span></a
          >
          <a
            class="link"
            href="https://g.page/r/CRwukpi9iPAXECE/review"
            target="_blank"
            rel="noopener noreferrer"
            ><span class="symbol">☆</span
            ><span class="name">Leave a Review</span
            ><span class="arrow">›</span></a
          >
        </nav>
        <p class="footer">JAWA COFFEE · HURGHADA</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
