<html lang="en">

    <meta charset="UTF-8" />

    <title>JAWA Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- Language selector -->

      <div class="language-switcher">
        <button

      <section class="hero">
        <div class="hero__overlay"></div>
      </section>

      <div class="hero-menu-gap" aria-hidden="true"></div>

      <section class="menu-section" id="menu">
        <header class="menu-heading">
          <h1>OUR MENU</h1>
          <span class="menu-heading__subtitle"
            >Choose a category to quickly find what you want.</span
          >

          <div class="menu-heading__ornament" aria-hidden="true">
            <span></span
            ><img
              src="../assets/coffee-bean-svgrepo-com.svg"
              alt=""
            /><span></span>
          </div>
        </header>

        <div class="filters-wrap" id="filtersWrap">
          <nav class="filters" id="filters" aria-label="Menu categories"></nav>
        </div>

        <div id="menuContent" class="menu-content" aria-live="polite"></div>
      </section>

      <footer class="footer" id="social">
        <p>Our socials</p>
        <div class="socials" aria-label="Social media links">
          <a
            href="https://www.instagram.com/jawa.coffeeshop/"
            aria-label="Instagram"
            >IG</a
          >
          <a
            href="https://www.tiktok.com/@jawa.coffeeshop?lang=fr"
            aria-label="TikTok"
            >♪</a
          >
          <a
            href="hhttps://www.facebook.com/profile.php?id=61596835888724"
            aria-label="Facebook"
            >f</a
          >
        </div>
        <p>All prices are in EGP and include VAT.</p>
        <small class="logo-footer">© <span id="year"></span> JAWA Coffee</small>
      </footer>
    </main>

    <script src="script.js"></script>

    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
